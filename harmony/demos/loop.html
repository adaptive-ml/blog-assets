<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>harmony — the loop</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #ffffff;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
                cursor: grab;
            }
            body.grabbing canvas {
                cursor: grabbing;
            }
        </style>
      <script type="module" crossorigin src="../assets/demos/loop-CvH8x1rT.js"></script>
      <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
    </head>
    <body>
        <canvas></canvas>
        <script>
            window.addEventListener("pointerdown", () => document.body.classList.add("grabbing"));
            window.addEventListener("pointerup", () => document.body.classList.remove("grabbing"));
        </script>
    </body>
</html>
